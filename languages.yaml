max_concurrent_jobs: 4
queue_timeout_s: 10

languages:
  - id: py3
    name: Python 3
    source_filename: solution.py
    run:
      cmd: /usr/bin/python3
      args: ["{{source}}"]
      limits:
        wall_time_s: 9
        memory_kb: 102400
        max_processes: 100
      flag_allowlist: ["-u", "-O"]

  - id: cpp
    name: C++
    source_filename: solution.cpp
    artifact: solution
    version_probe: /usr/bin/g++ --version
    build:
      cmd: /usr/bin/g++
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits: { wall_time_s: 3, memory_kb: 1048576, max_processes: 100 }
      flag_allowlist: ["-O0","-O1","-O2","-O3","-Wall","-Wextra","-std=*"]
    run:
      cmd: ./{{artifact}}
      limits: { wall_time_s: 3, memory_kb: 524288, max_processes: 64 }
      flag_allowlist: ["--help"]

  - id: bash
    name: Bash
    source_filename: script.sh
    run:
      cmd: /usr/bin/bash
      args: ["{{source}}"]
      limits: { wall_time_s: 2, memory_kb: 51200, max_processes: 10 }
  
  - id: rust
    name: Rust
    source_filename: solution.rs
    artifact: solution
    version_probe: /usr/bin/rustc --version
    build:
      cmd: /usr/bin/rustc
      args: ["{{source}}", "-o", "{{artifact}}", "{{flags}}"]
      limits: { wall_time_s: 5, memory_kb: 1048576, max_processes: 100 }
      flag_allowlist: ["-O", "--opt-level=*"]
    run:
      cmd: ./{{artifact}}
      limits: { wall_time_s: 2, memory_kb: 102400, max_processes: 10 }

  - id: java
    name: Java 17
    source_filename_strategy: from_request
    artifact_filename_strategy: from_request
    version_probe: /usr/bin/javac -version
    build:
      cmd: /usr/bin/javac
      args: ["-J-Xmx128m", "-J-XX:+UseSerialGC", "-J-XX:+TieredCompilation", "-J-XX:TieredStopAtLevel=1", "-g:none", "-d", ".", "{{source}}"]
      limits: { wall_time_s: 10, memory_kb: 1048576, max_processes: 100, rlimit_as: 4096 }
    run:
      cmd: /usr/bin/java
      args: ["-Xms160m", "-Xmx200m", "-XX:+UseSerialGC", "-XX:+TieredCompilation", "-XX:TieredStopAtLevel=1", "-cp", ".", "{{artifact}}"]
      limits: { wall_time_s: 8, memory_kb: 524288, max_processes: 64, rlimit_as: 4096 }

  - id: c
    name: C
    source_filename: solution.c
    artifact: solution
    version_probe: "/usr/bin/gcc --version"
    build:
      cmd: /usr/bin/gcc
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits: { wall_time_s: 3, memory_kb: 1048576, max_processes: 100 }
      flag_allowlist: ["-O0","-O1","-O2","-O3","-Wall","-Wextra","-std=*"]
    run:
      cmd: ./{{artifact}}
      args: []
      limits: { wall_time_s: 3, memory_kb: 524288, max_processes: 64 }

  - id: js
    name: JavaScript (Node)
    source_filename: solution.js
    version_probe: "/usr/bin/node --version"
    run:
      cmd: /usr/bin/node
      args: ["{{source}}"]
      limits: { wall_time_s: 9, memory_kb: 1048576, max_processes: 100 }

  - id: verilog
    name: Verilog (Icarus)
    source_filename: solution.v
    artifact: solution.vvp
    version_probe: "/usr/bin/iverilog -V"
    build:
      cmd: /usr/bin/iverilog
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits: { wall_time_s: 10, memory_kb: 524288, max_processes: 100 }
      flag_allowlist: ["-g2012", "-g2005", "-Wall"]
    run:
      cmd: /usr/bin/vvp
      args: ["{{artifact}}"]
      limits: { wall_time_s: 10, memory_kb: 262144, max_processes: 100 }

  - id: go
    name: Go
    source_filename: solution.go
    artifact: solution
    version_probe: /usr/bin/go version
    build:
      cmd: /usr/bin/env
      args: ["GO111MODULE=off", "CGO_ENABLED=0", "GOPATH=/tmp", "GOCACHE=/tmp/go-build", "go", "build", "-o", "{{artifact}}", "{{source}}"]
      limits: { wall_time_s: 10, memory_kb: 1048576, max_processes: 100, rlimit_as: 4096 }
    run:
      cmd: ./{{artifact}}
      limits: { wall_time_s: 5, memory_kb: 1048576, max_processes: 64, rlimit_as: 4096 }

  - id: kotlin
    name: Kotlin
    source_filename: solution.kt
    artifact: solution.jar
    version_probe: /usr/bin/kotlinc -version
    build:
      cmd: /usr/bin/kotlinc
      args: ["{{source}}", "-include-runtime", "-d", "{{artifact}}"]
      limits: { wall_time_s: 20, memory_kb: 1048576, max_processes: 100, rlimit_as: 4096 }
    run:
      cmd: /usr/bin/java
      args: ["-jar", "{{artifact}}"]
      limits: { wall_time_s: 5, memory_kb: 524288, max_processes: 64, rlimit_as: 4096 }

  - id: csharp
    name: C# (Mono)
    source_filename: solution.cs
    artifact: solution.exe
    version_probe: /usr/bin/mcs --version
    build:
      cmd: /usr/bin/mcs
      args: ["-out:{{artifact}}", "{{source}}"]
      limits: { wall_time_s: 10, memory_kb: 524288, max_processes: 100 }
    run:
      cmd: /usr/bin/mono
      args: ["{{artifact}}"]
      limits: { wall_time_s: 5, memory_kb: 262144, max_processes: 64 }

  - id: ruby
    name: Ruby
    source_filename: solution.rb
    version_probe: /usr/bin/ruby -v
    run:
      cmd: /usr/bin/ruby
      args: ["{{source}}"]
      limits: { wall_time_s: 5, memory_kb: 1048576, max_processes: 64 }

  - id: lua
    name: Lua
    source_filename: solution.lua
    version_probe: /usr/bin/lua5.4 -v
    run:
      cmd: /usr/bin/lua5.4
      args: ["{{source}}"]
      limits: { wall_time_s: 5, memory_kb: 102400, max_processes: 64 }

  - id: ocaml
    name: OCaml
    source_filename: solution.ml
    artifact: solution
    version_probe: /usr/bin/ocamlc -version
    build:
      cmd: /usr/bin/ocamlopt
      args: ["-o", "{{artifact}}", "{{source}}"]
      limits: { wall_time_s: 10, memory_kb: 524288, max_processes: 100 }
    run:
      cmd: ./{{artifact}}
      limits: { wall_time_s: 5, memory_kb: 102400, max_processes: 64 }

  - id: swift
    name: Swift
    source_filename: solution.swift
    artifact: solution
    version_probe: /usr/local/bin/swift --version
    build:
      cmd: /usr/bin/env
      args: ["HOME=/tmp", "XDG_CACHE_HOME=/tmp", "/usr/local/bin/swiftc", "-module-cache-path", "/tmp/swift-cache", "-Xcc", "-fmodules-cache-path=/tmp/clang-cache", "{{source}}", "-o", "{{artifact}}"]
      limits: { wall_time_s: 15, memory_kb: 1048576, max_processes: 100, rlimit_as: 4096 }
    run:
      cmd: ./{{artifact}}
      limits: { wall_time_s: 5, memory_kb: 262144, max_processes: 64, rlimit_as: 4096 }

  - id: zig
    name: Zig
    source_filename: solution.zig
    artifact: solution
    version_probe: /usr/local/bin/zig version
    build:
      cmd: /usr/bin/env
      args: ["ZIG_GLOBAL_CACHE_DIR=/root/.cache/zig-cache", "/usr/local/bin/zig", "build-exe", "{{source}}", "-femit-bin={{artifact}}"]
      limits: { wall_time_s: 30, memory_kb: 1048576, max_processes: 100, rlimit_as: 4096 }
    run:
      cmd: ./{{artifact}}
      limits: { wall_time_s: 5, memory_kb: 102400, max_processes: 64 }

  - id: typescript
    name: TypeScript
    source_filename: solution.ts
    artifact: solution.js
    version_probe: /usr/local/bin/tsc --version
    build:
      cmd: /usr/local/bin/tsc
      args: ["--target", "ES2022", "--module", "commonjs", "--typeRoots", "/usr/local/lib/node_modules/@types", "--types", "node", "--skipLibCheck", "{{source}}"]
      limits: { wall_time_s: 10, memory_kb: 1048576, max_processes: 100, rlimit_as: 4096 }
    run:
      cmd: /usr/bin/node
      args: ["{{artifact}}"]
      limits: { wall_time_s: 5, memory_kb: 524288, max_processes: 64 }

  - id: dart
    name: Dart
    source_filename: solution.dart
    artifact: solution
    version_probe: /usr/local/bin/dart --version
    build:
      cmd: /usr/local/bin/dart
      args: ["compile", "exe", "{{source}}", "-o", "{{artifact}}"]
      limits: { wall_time_s: 15, memory_kb: 1048576, max_processes: 100, rlimit_as: 4096 }
    run:
      cmd: ./{{artifact}}
      limits: { wall_time_s: 5, memory_kb: 262144, max_processes: 64, rlimit_as: 4096 }

  - id: fortran
    name: Fortran
    source_filename: solution.f90
    artifact: solution
    version_probe: /usr/bin/gfortran --version
    build:
      cmd: /usr/bin/gfortran
      args: ["{{flags}}", "-o", "{{artifact}}", "{{source}}"]
      limits: { wall_time_s: 5, memory_kb: 524288, max_processes: 100 }
      flag_allowlist: ["-O0", "-O1", "-O2", "-O3", "-Wall", "-Wextra", "-std=*"]
    run:
      cmd: ./{{artifact}}
      limits: { wall_time_s: 3, memory_kb: 102400, max_processes: 64 }
